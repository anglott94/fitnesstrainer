<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- Kein maximum-scale/user-scalable=no: Das Sperren des Zooms verstößt gegen
         WCAG 1.4.4 und nimmt jedem die Lupe für die Übungshinweise. Der übliche
         Grund dafür — iOS zoomt beim Fokussieren kleiner Eingabefelder — greift
         hier nicht, die Felder erben 16px aus dem body. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1018" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Schiri-Trainer" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Schiri-Trainer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
